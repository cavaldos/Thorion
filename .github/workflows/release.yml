name: Release

# Push a tag like v0.3.0 → builds the DMG and creates a DRAFT GitHub Release.
# Test the DMG, then run ./script/notify-update.sh vX.Y.Z to publish + bump Homebrew.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh derives the build number from commit count

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Thorion.xcodeproj -scheme thorion \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Build DMG
        run: ./script/build.sh "${GITHUB_REF_NAME}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/Thorion.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/Thorion.dmg \
              --title "Thorion ${GITHUB_REF_NAME}" \
              --generate-notes \
              --draft
          fi
